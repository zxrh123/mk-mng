 [project]
 name = "mikrotik-ai-platform"
 version = "0.1.0"
 description = "AI-driven network management platform for MikroTik RouterOS"
 requires-python = ">=3.11"
 authors = [
     { name = "AI System Architect", email = "dev@example.com" }
 ]
 dependencies = [
     "fastapi[all]~=0.111",
     "uvicorn[standard]~=0.30",
     "pydantic-settings~=2.3",
     "sqlalchemy[asyncio]~=2.0",
     "asyncpg~=0.29",
     "alembic~=1.13",
     "httpx~=0.27",
     "paramiko~=3.5",
     "python-jose[cryptography]~=3.3",
     "passlib[bcrypt]~=1.7",
     "redis~=5.1",
     "tenacity~=8.2",
     "orjson~=3.10",
     "apscheduler~=3.10",
     "beautifulsoup4~=4.12",
     "lxml~=5.2",
     "scikit-learn~=1.5",
     "pandas~=2.2",
     "numpy~=2.1",
     "loguru~=0.7",
     "pyyaml~=6.0"
 ]

 [project.optional-dependencies]
 dev = [
     "pytest~=8.3",
     "pytest-asyncio~=0.23",
     "httpx~=0.27",
     "ruff~=0.6",
     "mypy~=1.11"
 ]

 [build-system]
 requires = ["setuptools>=68", "wheel"]
 build-backend = "setuptools.build_meta"

 [tool.ruff]
 target-version = "py311"
 line-length = 100
 select = ["E", "F", "I", "N", "UP", "ASYNC", "S", "B", "A"]
 ignore = ["E501"]

 [tool.mypy]
 python_version = "3.11"
 plugins = ["pydantic.mypy"]
 warn_unused_configs = true
 disallow_untyped_defs = true
 disallow_incomplete_defs = true
