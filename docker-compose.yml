version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: mikrotik_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mikrotik_ai
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: mikrotik_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mikrotik_ai_backend
    depends_on:
      - postgres
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=mikrotik_ai
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=mikrotik_ai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ROUTEROS_HOSTS=${ROUTEROS_HOSTS:-}
      - ROUTEROS_USERNAME=${ROUTEROS_USERNAME:-}
      - ROUTEROS_PASSWORD=${ROUTEROS_PASSWORD:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mikrotik_ai_frontend
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://backend:8000/api/v1
      - VITE_WS_URL=ws://backend:8000/ws/assistant
    ports:
      - "5173:80"

volumes:
  postgres_data:
