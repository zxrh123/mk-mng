version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mikrotik_ai_postgres
    environment:
      POSTGRES_USER: mikrotik_user
      POSTGRES_PASSWORD: mikrotik_password
      POSTGRES_DB: mikrotik_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikrotik_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mikrotik_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mikrotik_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mikrotik_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mikrotik_ai_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://mikrotik_user:mikrotik_password@postgres:5432/mikrotik_ai
      DATABASE_SYNC_URL: postgresql://mikrotik_user:mikrotik_password@postgres:5432/mikrotik_ai
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - mikrotik_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mikrotik_ai_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - mikrotik_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  mikrotik_network:
    driver: bridge
